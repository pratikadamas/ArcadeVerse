<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Neon Pong | ArcadeVerse</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Favicon and Brand Icons -->
  <link rel="icon" type="image/x-icon" href="../../assets/public/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/public/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/public/apple-touch-icon.png">
</head>
<body>
  <div class="game-header">
    <div class="game-title">
      <i data-lucide="gamepad-2"></i> Cyber Neon Pong
    </div>
    <div class="author-badge">Created by @DebasmitaBose0 • Match Rules Edition</div>
  </div>

  <!-- Match Setup: game mode and score limit -->
  <div class="pong-modebar">
    <div class="difficulty-group" role="group" aria-label="Game Mode">
      <button type="button" class="mode-btn active" data-mode="ai" aria-pressed="true"><i data-lucide="cpu"></i> 1P vs AI</button>
      <button type="button" class="mode-btn" data-mode="versus" aria-pressed="false"><i data-lucide="users"></i> 2P Local</button>
    </div>
    <div class="difficulty-group" role="group" aria-label="Score Limit">
      <button type="button" class="target-btn" data-target="5" aria-pressed="false">First to 5</button>
      <button type="button" class="target-btn active" data-target="7" aria-pressed="true">First to 7</button>
      <button type="button" class="target-btn" data-target="10" aria-pressed="false">First to 10</button>
    </div>
  </div>

  <!-- Settings & Difficulty Toolbar -->
  <div class="pong-toolbar">
    <div class="difficulty-group" id="difficulty-group" role="group" aria-label="AI Difficulty Level">
      <button type="button" class="diff-btn active" data-difficulty="easy">Easy</button>
      <button type="button" class="diff-btn" data-difficulty="pro">Pro</button>
      <button type="button" class="diff-btn" data-difficulty="cyber">Cyber</button>
    </div>

    <div class="toolbar-actions">
      <button type="button" class="icon-btn" id="pause-btn" title="Pause Game (P or Space)" aria-label="Pause Game">
        <i data-lucide="pause" id="pause-icon"></i>
      </button>
      <button type="button" class="icon-btn" id="sound-btn" title="Toggle Sound" aria-label="Toggle Sound">
        <i data-lucide="volume-2" id="sound-icon"></i>
      </button>
      <button type="button" class="icon-btn" id="restart-btn" title="Reset Match" aria-label="Reset Match">
        <i data-lucide="rotate-ccw"></i>
      </button>
    </div>
  </div>

  <div class="score-board" role="status" aria-live="polite">
    <span class="score-player"><span id="left-label">Player</span>: <strong id="player-score">0</strong></span>
    <span class="match-target-tag" id="match-target-tag">First to 7</span>
    <span class="score-ai"><span id="right-label">AI</span>: <strong id="ai-score">0</strong></span>
  </div>

  <div class="canvas-wrapper">
    <canvas id="pongCanvas" width="600" height="380" role="img" aria-label="Cyber Neon Pong interactive court" tabindex="0"></canvas>
    
    <!-- Pause Overlay -->
    <div class="pong-overlay hidden" id="pause-overlay">
      <div class="overlay-card">
        <h2>Match Paused</h2>
        <p>Press <strong>P</strong>, <strong>Space</strong>, or click Resume to continue</p>
        <button type="button" class="btn-primary" id="resume-btn">Resume Match</button>
      </div>
    </div>

    <!-- Match Over Overlay -->
    <div class="pong-overlay hidden" id="gameover-overlay">
      <div class="overlay-card">
        <h2 id="winner-title">Victory!</h2>
        <p id="winner-desc">You dominated the neon court!</p>
        <div class="final-score-row" id="final-score-display">7 - 3</div>
        <button type="button" class="btn-primary" id="play-again-btn">Play Again</button>
      </div>
    </div>
  </div>

  <p class="instructions" id="instructions">
    Control paddle: <strong>Mouse / Touch</strong> or <strong>Arrow Keys / W & S</strong> • <strong>P</strong> to Pause
  </p>

  <script src="game.js"></script>
  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
