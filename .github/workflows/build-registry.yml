name: Auto-Build Games Registry

on:
  push:
    branches: [ main ]
    paths:
      - 'games/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify No Forbidden Auto-Generated Edits (PR Only)
        if: github.event_name == 'pull_request'
        run: |
          # Ensure PRs do not edit assets/js/games-registry.js manually (auto-compiled on merge).
          # Root files (index.html, leaderboard.html, assets/*) CAN be modified when necessary for assigned platform/UI issues.
          FORBIDDEN=$(git diff --name-only origin/main...HEAD | grep -E '^assets/js/games-registry\.js$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Pull Request modifies auto-generated file: $FORBIDDEN"
            echo "Per CONTRIBUTING.md, contributors must not edit 'assets/js/games-registry.js' manually."
            echo "Game registration is 100% automated by GitHub Actions from 'games/<game-id>/game.json'."
            echo "To fix merge conflicts, please revert this file:"
            echo "  git checkout origin/main -- assets/js/games-registry.js"
            echo "  git commit -m 'chore: revert manual changes to games-registry.js'"
            echo "  git push"
            exit 1
          fi

      - name: Validate Community Games Pre-Flight & Asset Integrity
        run: node scripts/validate-games.js --audit-hub --strict-assets

      - name: Test Playlist Share Codes
        run: node --test scripts/test-playlist-codes.js

      - name: Test Registry Auto-Compilation (PR Dry Run)
        if: github.event_name == 'pull_request'
        run: node scripts/build-registry.js

      - name: Compile Games Registry & Contributor Stats (On Merge)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-registry.js

      - name: Commit & Push Updated Registry
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/games-registry.js
          if git diff --staged --quiet; then
            echo "No registry changes detected."
          else
            git commit -m "chore(registry): auto-compile games-registry.js [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
