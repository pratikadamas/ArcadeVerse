name: Auto-Sanitize PR Registry Conflicts

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'assets/js/games-registry.js'

permissions:
  contents: read
  pull-requests: write

jobs:
  check-and-notify-registry-conflict:
    name: Sanitize PR Registry & Notify Contributor
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PR Files & Post Guidance Comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch the list of modified files via GitHub REST API without checking out untrusted code
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: prNumber }
            );

            const modifiesRegistry = files.some(f => f.filename === 'assets/js/games-registry.js');
            if (!modifiesRegistry) {
              console.log('PR does not modify assets/js/games-registry.js. Exiting cleanly.');
              return;
            }

            // Check if guidance comment was already posted to avoid duplicate comment spam
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber }
            );

            const alreadyCommented = comments.some(c =>
              c.user && c.user.login === 'github-actions[bot]' &&
              c.body && c.body.includes('Merge Conflict Notice:')
            );

            if (alreadyCommented) {
              console.log('Guidance comment already present on PR #' + prNumber + '. Skipping duplicate notice.');
              return;
            }

            const noticeBody = [
              '**Merge Conflict Notice:** Your pull request modifies `assets/js/games-registry.js`. Per `CONTRIBUTING.md`, game registration is 100% automated by GitHub Actions from `games/<game-id>/game.json` upon merge.',
              '',
              'Manual edits to `assets/js/games-registry.js` create merge conflicts with the `main` branch. Please revert this file on your branch to resolve conflicts:',
              '',
              '```bash',
              'git checkout origin/main -- assets/js/games-registry.js',
              'git commit -m "chore: revert manual changes to games-registry.js"',
              'git push',
              '```'
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: noticeBody
            });

            console.log('Successfully posted registry revert guidance to PR #' + prNumber);
