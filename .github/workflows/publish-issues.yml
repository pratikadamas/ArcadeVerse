name: Safe Issue Publisher

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of issues to publish in this batch'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
      dry_run:
        description: 'Dry run (test without creating actual issues)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  publish:
    name: Publish Issues via Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Safe Issue Publisher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/publish-issues.js

      - name: Commit & Push Updated Issue Queue
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/issue-queue/pending.json .github/issue-queue/published.json
          git diff --staged --quiet || git commit -m "chore(issues): update automated issue queue [skip ci]"
          git push origin main
